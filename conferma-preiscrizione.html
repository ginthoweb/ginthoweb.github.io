<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Preiscrizione gratuita | GinTho</title><link rel="stylesheet" href="assets/style.css"><style>main{max-width:900px!important;padding-top:12px;padding-bottom:40px}.top{padding:12px 0 22px}h1{font-size:clamp(30px,4.5vw,48px);line-height:1.12;letter-spacing:-1px;margin:12px 0 18px}h2{font-size:clamp(22px,3vw,28px);line-height:1.25;letter-spacing:0;margin-top:0}.card{margin:22px 0;padding:clamp(20px,4vw,32px);scroll-margin-top:22px}.intro{max-width:760px}.progress{display:flex;gap:10px;padding:0;list-style:none;margin:24px 0;counter-reset:step}.progress li{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-weight:600}.progress li:before{counter-increment:step;content:counter(step) '. ';color:var(--gold)}.progress li.complete{border-color:#5bbc8a;background:#14372a}.step-locked{opacity:.75}label{display:block;margin:14px 0;line-height:1.6}input:not([type=checkbox]){display:block;width:100%;padding:13px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit}input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold);vertical-align:middle;margin-right:6px}button{font:inherit;cursor:pointer;min-height:46px}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.feedback{padding:16px 18px;margin:16px 0;border:2px solid var(--gold);background:#222c3a;color:#fff;border-radius:10px;line-height:1.6;font-weight:600;overflow-wrap:anywhere}.feedback.message-error{border-color:#ee9b8d;background:#442720}.receipt-card{border:2px solid #5bbc8a}.receipt-card .feedback{border-color:#5bbc8a;background:#14372a}fieldset{border:0;padding:0;min-width:0}fieldset:disabled{opacity:.5}.muted{font-size:15px}a{text-decoration:underline}h2:focus{outline:none}[hidden]{display:none!important}.account-state{font-weight:600}#receipt-data{overflow-wrap:anywhere}@media(max-width:600px){.field-grid{grid-template-columns:1fr}.progress{font-size:14px;gap:5px}.progress li{padding:9px 6px}.actions .btn{width:100%}}.card .feedback{color:#fff!important}button.btn.secondary{color:#f4f5f7!important}button.btn.primary{color:#111!important}</style></head><body><main class="container"><header class="top"><a href="index.html">GinTho · Torna alla home</a></header><h1 id="title">Conferma in corso…</h1><section class="card receipt-card"><p id="feedback" class="feedback" role="status" aria-live="polite">Verifica dell’email e invio automatico della preiscrizione. Attendi qualche istante.</p><p id="result-text"></p><button id="retry" class="btn primary" hidden>Riprova la conferma</button><p><a href="iscrizione.html">Torna alla preiscrizione</a></p></section></main><script type="module" src="assets/confirm-signup.js?v=2.0.0"></script></body></html>
